name: Turno da bancada

# Cada turno trabalha 5h30 e, ao terminar, chama o próximo. A agenda abaixo é só
# reserva: em 19/09 o GitHub pulou quase todos os disparos de hora em hora e o
# escritório ficou parado horas seguidas. Se a corrente quebrar, a reserva religa.
# Para parar a bancada de vez: desative este workflow na aba Actions.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# um turno por vez: o que chegar enquanto outro trabalha espera na fila
concurrency:
  group: turno
  cancel-in-progress: false

jobs:
  turno:
    runs-on: ubuntu-latest
    # o limite do GitHub é 6 horas; o motor para de pegar trabalho novo 40 minutos
    # antes do fim do turno (MARGEM_FIM_MIN), o bastante para o documento em curso
    # terminar, então 330 de turno cabem com folga em 350
    timeout-minutes: 350
    steps:
      # histórico inteiro: é pela data do último sinal de vida que se decide o próximo
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Trabalhar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_CONTA: ${{ secrets.FIREBASE_CONTA }}
          DURACAO_MIN: '330'
          # Os botões do ritmo, aqui para poderem ser mexidos sem tocar em código:
          # editar o número nesta página e salvar já vale para o próximo turno.
          # CPS é a velocidade da escrita na tela (era 20 até 23/09, virou 8 para
          # dar para acompanhar lendo). INTERVALO_MIN é o tempo do começo de um
          # documento ao começo do próximo (era 13, depois 17, e virou 35 quando o
          # documento passou a levar 24 minutos de tela).
          CPS: '8'
          INTERVALO_MIN: '35'
        run: |
          # O freio de mão. Um arquivo PAUSADA na raiz para a bancada inteira: este
          # turno não trabalha e não chama o próximo. Para voltar, apague o arquivo
          # pelo github.com e rode o workflow na mão. Existe porque a pausa do
          # administrador (o lanche) só vale entre documentos e depende do
          # Firestore: quando o que está saindo está errado, é preciso parar agora.
          if [ -f PAUSADA ]; then
            echo "PAUSADA na raiz: a bancada está parada de propósito"; cat PAUSADA
            # a tela não pode ficar congelada no último passo do turno anterior
            node aovivo/avisa-pausa.mjs || true
            exit 0
          fi
          # sem o Firestore o trabalho não aparece em lugar nenhum: não gasta cota à toa
          if [ -z "$FIREBASE_CONTA" ]; then echo "FIREBASE_CONTA ausente, turno não roda"; exit 0; fi
          node aovivo/motor.mjs
      # a corrente: este turno chama o próximo, mesmo se o motor tiver caído. Só
      # não chama quando o freio de mão está puxado, senão a pausa nunca pegaria.
      - name: Chamar o próximo turno
        if: always() && hashFiles('PAUSADA') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run turno.yml --repo "${{ github.repository }}"
      # O GitHub desliga agenda de repositório público sem atividade por 60 dias.
      # Uma vez por mês, o primeiro turno do mês deixa um sinal de vida.
      - name: Sinal de vida
        if: always()
        run: |
          if [ "$(git log -1 --format=%cd --date=format:%Y%m -- .vivo 2>/dev/null)" != "$(date -u +%Y%m)" ]; then
            date -u > .vivo
            git config user.name "Bancada" && git config user.email "bancada@users.noreply.github.com"
            git add .vivo && git commit -m "sinal de vida" && git push || true
          fi
