name: Vigia da bancada

# Confere se a bancada está trabalhando e religa o turno se ela travou. O
# resultado de cada ronda vai para o Firestore e aparece no /admin/. Existe para o
# escritório se cuidar sozinho com o PC do Rubens desligado.
#
# Quatro agendas em vez de uma, e isto é medido: de 20/09 a 01/10 o '*/30' pediu
# 48 rondas por dia e o GitHub entregou de 3 a 6, porque agenda de Actions é
# melhor esforço e as nossas caem sempre na mesma hora cheia. Quatro pedidos por
# meia hora, em minutos diferentes, sobem a chance de um deles passar. Ronda que
# chega junto é descartada pelo grupo de concorrência, e cada uma custa 15
# segundos num repositório público, onde minuto é de graça.
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '7,37 * * * *'
    - cron: '16,46 * * * *'
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: true

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ronda
        env:
          FIREBASE_CONTA: ${{ secrets.FIREBASE_CONTA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FIREBASE_CONTA" ]; then echo "sem FIREBASE_CONTA, nada a vigiar"; exit 0; fi
          node aovivo/vigia.mjs
